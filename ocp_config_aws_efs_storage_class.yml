---
- name: Configure OCP Storage Class for AWS EFS playbook
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Configure OCP Storage Class for AWS EFS (Block)
      block:
        - name: Get OpenShift API token
          redhat.openshift.openshift_auth:
            host: "{{ aap_ocp_install_connection['host'] | mandatory }}"
            username: "{{ aap_ocp_install_connection['username'] | mandatory }}"
            password: "{{ aap_ocp_install_connection['password'] | mandatory }}"
            validate_certs: "{{ aap_ocp_install_connection['validate_certs'] | default(omit) }}"
          register: pre_tasks_auth_results
          when: aap_ocp_install_connection['api_key'] is not defined

        - name: Set authentication for provided API key
          ansible.builtin.set_fact:
            pre_tasks_auth_results:
              openshift_auth:
                host: "{{ aap_ocp_install_connection['host'] | mandatory }}"
                api_key: "{{ aap_ocp_install_connection['api_key'] | mandatory }}"
                validate_certs: "{{ aap_ocp_install_connection['validate_certs'] | default(omit) }}"
          when: aap_ocp_install_connection['api_key'] is defined

        - name: Create secret for AWS EFS Operator
          kubernetes.core.k8s:
            host: "{{ pre_tasks_auth_results['openshift_auth']['host'] }}"
            api_key: "{{ pre_tasks_auth_results['openshift_auth']['api_key'] }}"
            validate_certs: "{{ aap_ocp_install_connection['validate_certs'] | default(omit) }}"
            state: present
            resource_definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: aws-efs-cloud-credentials
                namespace: openshift-cluster-csi-drivers
              stringData:
                credentials: |-
                  [default]
                  role_arn = "{{ aws_efs_csi_aim_role_arn }}"
                  web_identity_token_file = /var/run/secrets/openshift/serviceaccount/token

        - name: Create CSI Driver Operator Group
          kubernetes.core.k8s:
            host: "{{ pre_tasks_auth_results['openshift_auth']['host'] }}"
            api_key: "{{ pre_tasks_auth_results['openshift_auth']['api_key'] }}"
            validate_certs: "{{ aap_ocp_install_connection['validate_certs'] | default(omit) }}"
            state: present
            resource_definition:
              apiVersion: operators.coreos.com/v1
              kind: OperatorGroup
              metadata:
                name: aws-efs-csi-driver-operator
                namespace: openshift-cluster-csi-drivers

        - name: Create EFS CSI Driver Operator Subscription
          kubernetes.core.k8s:
            host: "{{ pre_tasks_auth_results['openshift_auth']['host'] }}"
            api_key: "{{ pre_tasks_auth_results['openshift_auth']['api_key'] }}"
            validate_certs: "{{ aap_ocp_install_connection['validate_certs'] | default(omit) }}"
            state: present
            resource_definition:
              apiVersion: operators.coreos.com/v1alpha1
              kind: Subscription
              metadata:
                labels:
                  operators.coreos.com/aws-efs-csi-driver-operator.openshift-cluster-csi-drivers: ""
                name: aws-efs-csi-driver-operator
                namespace: openshift-cluster-csi-drivers
              spec:
                channel: stable
                installPlanApproval: "{{ aws_efs_csi_operator_approval | default('Automatic') }}"
                name: aws-efs-csi-driver-operator
                source: redhat-operators
                sourceNamespace: openshift-marketplace
                config:
                  env:
                    - name: ROLEARN
                      value: "{{ aws_efs_csi_aim_role_arn }}"

        - name: Wait for operator installplan to appear
          kubernetes.core.k8s_info:
            host: "{{ pre_tasks_auth_results['openshift_auth']['host'] }}"
            api_key: "{{ pre_tasks_auth_results['openshift_auth']['api_key'] }}"
            validate_certs: "{{ aap_ocp_install_connection['validate_certs'] | default(omit) }}"
            kind: Subscription
            name: aws-efs-csi-driver-operator
            api_version: operators.coreos.com/v1alpha1
            namespace: openshift-cluster-csi-drivers
          register: aws_efs_csi_driver_installplan_result
          until:
            - aws_efs_csi_driver_installplan_result is defined
            - ('resources' in aws_efs_csi_driver_installplan_result)
            - aws_efs_csi_driver_installplan_result.resources | length > 0
            - ('status' in aws_efs_csi_driver_installplan_result.resources[0])
            - ('installplan' in aws_efs_csi_driver_installplan_result.resources[0].status)
          retries: 60  # Wait for 15 minutes (60*15/60)
          delay: 15

        - name: Update install plan
          when: (aws_efs_csi_operator_approval | default('Automatic') | lower) == 'manual'
          kubernetes.core.k8s:
            host: "{{ pre_tasks_auth_results['openshift_auth']['host'] }}"
            api_key: "{{ pre_tasks_auth_results['openshift_auth']['api_key'] }}"
            validate_certs: "{{ aap_ocp_install_connection['validate_certs'] | default(omit) }}"
            definition:
              kind: InstallPlan
              apiVersion: operators.coreos.com/v1alpha1
              metadata:
                namespace: openshift-cluster-csi-drivers
                name: "{{ aws_efs_csi_driver_installplan_result.resources[0].status.installplan.name }}"
              spec:
                approved: true

        - name: Retrieve Installed CSV
          kubernetes.core.k8s_info:
            host: "{{ pre_tasks_auth_results['openshift_auth']['host'] }}"
            api_key: "{{ pre_tasks_auth_results['openshift_auth']['api_key'] }}"
            validate_certs: "{{ aap_ocp_install_connection['validate_certs'] | default(omit) }}"
            kind: Subscription
            name: aws-efs-csi-driver-operator
            api_version: operators.coreos.com/v1alpha1
            namespace: openshift-cluster-csi-drivers
          register: aws_efs_csi_driver_install_sub_approved_result
          retries: 60  # Wait for 15 minutes (60*15/60)
          delay: 15
          until:
            - aws_efs_csi_driver_install_sub_approved_result.resources[0].status.currentCSV is defined
            - aws_efs_csi_driver_install_sub_approved_result.resources[0].status.currentCSV | length > 0

        - name: Wait for Operator CSV to be Successful
          kubernetes.core.k8s_info:
            host: "{{ pre_tasks_auth_results['openshift_auth']['host'] }}"
            api_key: "{{ pre_tasks_auth_results['openshift_auth']['api_key'] }}"
            validate_certs: "{{ aap_ocp_install_connection['validate_certs'] | default(omit) }}"
            kind: ClusterServiceVersion
            name: "{{ aws_efs_csi_driver_install_sub_approved_result.resources[0].status.currentCSV }}"
            api_version: operators.coreos.com/v1alpha1
            namespace: openshift-cluster-csi-drivers
          register: aws_efs_csi_driver_install_csv_result
          until:
            - aws_efs_csi_driver_install_csv_result.resources[0].status.phase is defined
            - aws_efs_csi_driver_install_csv_result.resources[0].status.phase | length > 0
            - aws_efs_csi_driver_install_csv_result.resources[0].status.phase == "Succeeded"
          retries: 60  # Wait for 15 minutes (60*15/60)
          delay: 15

        - name: Install AWS EFS CSI Driver
          kubernetes.core.k8s:
            host: "{{ pre_tasks_auth_results['openshift_auth']['host'] }}"
            api_key: "{{ pre_tasks_auth_results['openshift_auth']['api_key'] }}"
            validate_certs: "{{ aap_ocp_install_connection['validate_certs'] | default(omit) }}"
            state: present
            resource_definition:
              apiVersion: operator.openshift.io/v1
              kind: ClusterCSIDriver
              metadata:
                name: efs.csi.aws.com
              spec:
                managementState: Managed

        - name: Wait for the AWS EFS CSI driver deamonset to be running
          kubernetes.core.k8s_info:
            host: "{{ pre_tasks_auth_results['openshift_auth']['host'] }}"
            api_key: "{{ pre_tasks_auth_results['openshift_auth']['api_key'] }}"
            validate_certs: "{{ aap_ocp_install_connection['validate_certs'] | default(omit) }}"
            kind: DaemonSet
            name: aws-efs-csi-driver-node
            api_version: apps/v1
            namespace: openshift-cluster-csi-drivers
          register: aws_efs_csi_driver_daemonset_result
          until:
            - aws_efs_csi_driver_daemonset_result.resources[0].status.desiredNumberScheduled is defined
            - aws_efs_csi_driver_daemonset_result.resources[0].status.numberReady is defined
            - aws_efs_csi_driver_daemonset_result.resources[0].status.desiredNumberScheduled > 0
            - aws_efs_csi_driver_daemonset_result.resources[0].status.numberReady == aws_efs_csi_driver_daemonset_result.resources[0].status.desiredNumberScheduled
          retries: 60  # Wait for 15 minutes (60*15/60)
          delay: 15

        - name: Create storage class
          kubernetes.core.k8s:
            host: "{{ pre_tasks_auth_results['openshift_auth']['host'] }}"
            api_key: "{{ pre_tasks_auth_results['openshift_auth']['api_key'] }}"
            validate_certs: "{{ aap_ocp_install_connection['validate_certs'] | default(omit) }}"
            state: present
            resource_definition:
              apiVersion: storage.k8s.io/v1
              kind: StorageClass
              metadata:
                name: "{{ rwx_storage_class_name }}"
              provisioner: efs.csi.aws.com
              parameters:
                provisioningMode: efs-ap
                fileSystemId: "{{ aws_efs_filesystem_id }}"
                directoryPerms: "700"
                gidRangeStart: "1000"
                gidRangeEnd: "2000"
                basePath: "/dynamic_provisioning"
              volumeBindingMode: WaitForFirstConsumer


      always:
        - name: If login succeeded revoke OpenShift API token
          when: pre_tasks_auth_results['openshift_auth']['api_key'] is defined and aap_ocp_install_connection['api_key'] is not defined
          redhat.openshift.openshift_auth:
            host: "{{ aap_ocp_install_connection['host'] | mandatory }}"
            validate_certs: "{{ aap_ocp_install_connection['validate_certs'] | default(omit) }}"
            state: absent
            api_key: "{{ pre_tasks_auth_results['openshift_auth']['api_key'] }}"
          changed_when: false

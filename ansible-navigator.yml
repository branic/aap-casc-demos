---
ansible-navigator:
  logging:
    level: debug
    append: false
    file: $PWD/.logs/ansible-navigator.log

  playbook-artifact:
    enable: true
    save-as: "$PWD/.logs/{playbook_name}-artifact-{time_stamp}.json"

  execution-environment:
    container-engine: podman
    enabled: true
    image: quay.io/branic/development-ee:latest
    pull:
      policy: missing
    container-options:
      - "--network=host"

  mode: stdout

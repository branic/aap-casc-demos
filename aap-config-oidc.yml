---
- name: Configure AAP 2.6 OIDC authentication
  hosts: localhost
  gather_facts: false

  vars:
    aap_configuration_collect_logs: true

  tasks:
    - name: Retrieve OIDC client secret from RHBK (Block)
      block:
        - name: Get OpenShift API token
          redhat.openshift.openshift_auth:
            host: "{{ aap_ocp_install_connection['host'] | mandatory }}"
            username: "{{ aap_ocp_install_connection['username'] | mandatory }}"
            password: "{{ aap_ocp_install_connection['password'] | mandatory }}"
            validate_certs: "{{ aap_ocp_install_connection['validate_certs'] | default(omit) }}"
          register: pre_tasks_auth_results
          when: aap_ocp_install_connection['api_key'] is not defined

        - name: Set authentication for provided API key
          ansible.builtin.set_fact:
            pre_tasks_auth_results:
              openshift_auth:
                host: "{{ aap_ocp_install_connection['host'] | mandatory }}"
                api_key: "{{ aap_ocp_install_connection['api_key'] | mandatory }}"
                validate_certs: "{{ aap_ocp_install_connection['validate_certs'] | default(omit) }}"
          when: aap_ocp_install_connection['api_key'] is defined

        - name: RHBK client secret retrieval (Block)
          environment:
            K8S_AUTH_HOST: "{{ pre_tasks_auth_results['openshift_auth']['host'] }}"
            K8S_AUTH_API_KEY: "{{ pre_tasks_auth_results['openshift_auth']['api_key'] }}"
            K8S_AUTH_VERIFY_SSL: "{{ aap_ocp_install_connection['validate_certs'] | default(omit) }}"
          block:
            - name: Read RHBK initial admin secret
              kubernetes.core.k8s_info:
                kind: Secret
                name: "{{ rhbk_instance_name }}-initial-admin"
                namespace: "{{ rhbk_namespace }}"
                api_version: v1
              register: _rhbk_admin_secret
              no_log: true

            - name: Set RHBK admin credentials
              ansible.builtin.set_fact:
                _rhbk_admin_user: "{{ _rhbk_admin_secret.resources[0].data.username | b64decode }}"
                _rhbk_admin_password: "{{ _rhbk_admin_secret.resources[0].data.password | b64decode }}"
              no_log: true

            - name: Generate RHBK auth token
              ansible.builtin.uri:
                url: "{{ rhbk_url }}/realms/master/protocol/openid-connect/token"
                method: POST
                body: "client_id=admin-cli&username={{ _rhbk_admin_user }}&password={{ _rhbk_admin_password }}&grant_type=password"
                validate_certs: "{{ rhbk_validate_certs }}"
              register: _rhbk_auth_response
              no_log: true

            - name: Look up OIDC client in RHBK
              ansible.builtin.uri:
                url: "{{ rhbk_url }}/admin/realms/{{ rhbk_realm_name }}/clients?clientId={{ rhbk_oidc_client_id }}"
                method: GET
                headers:
                  Authorization: "Bearer {{ _rhbk_auth_response.json.access_token }}"
                validate_certs: "{{ rhbk_validate_certs }}"
              register: _rhbk_oidc_client_lookup

            - name: Verify OIDC client exists in RHBK
              ansible.builtin.assert:
                that:
                  - _rhbk_oidc_client_lookup.json | length > 0
                fail_msg: >-
                  OIDC client '{{ rhbk_oidc_client_id }}' not found in RHBK realm '{{ rhbk_realm_name }}'.
                  Ensure rhbk-config-ocp.yml has been run with rhbk_oidc_client_enabled set to true.

            - name: Retrieve OIDC client secret from RHBK
              ansible.builtin.uri:
                url: "{{ rhbk_url }}/admin/realms/{{ rhbk_realm_name }}/clients/{{ _rhbk_oidc_client_lookup.json[0].id }}/client-secret"
                method: GET
                headers:
                  Authorization: "Bearer {{ _rhbk_auth_response.json.access_token }}"
                validate_certs: "{{ rhbk_validate_certs }}"
              register: _rhbk_oidc_client_secret_result
              no_log: true

            - name: Set OIDC client secret fact
              ansible.builtin.set_fact:
                rhbk_oidc_client_secret: "{{ _rhbk_oidc_client_secret_result.json.value }}"
              no_log: true

      always:
        - name: If login succeeded revoke OpenShift API token
          when: pre_tasks_auth_results['openshift_auth']['api_key'] is defined and aap_ocp_install_connection['api_key'] is not defined
          redhat.openshift.openshift_auth:
            host: "{{ aap_ocp_install_connection['host'] | mandatory }}"
            validate_certs: "{{ aap_ocp_install_connection['validate_certs'] | default(omit) }}"
            state: absent
            api_key: "{{ pre_tasks_auth_results['openshift_auth']['api_key'] }}"
          changed_when: false

    - name: Configure OIDC Authenticator
      ansible.builtin.import_role:
        name: infra.aap_configuration.gateway_authenticators

    - name: Configure OIDC Authenticator Maps
      ansible.builtin.import_role:
        name: infra.aap_configuration.gateway_authenticator_maps

    - name: Show errors if any
      when: aap_configuration_role_errors | default([]) | length > 0
      ansible.builtin.debug:
        var: aap_configuration_role_errors

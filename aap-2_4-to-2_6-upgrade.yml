---
- name: Upgrade AAP on OCP from 2.4 to 2.6
  hosts: localhost
  gather_facts: false

  vars:
    aap_ocp_upgrade_create_backups: true
    aap_ocp_upgrade_controller_backup_name: "pre-upgrade-24-to-26-controller"
    aap_ocp_upgrade_hub_backup_name: "pre-upgrade-24-to-26-hub"

  tasks:
    - name: Upgrade AAP on OCP
      block:
        - name: Get OpenShift API token
          redhat.openshift.openshift_auth:
            host: "{{ aap_ocp_install_connection['host'] | mandatory }}"
            username: "{{ aap_ocp_install_connection['username'] | mandatory }}"
            password: "{{ aap_ocp_install_connection['password'] | mandatory }}"
            validate_certs: "{{ aap_ocp_install_connection['validate_certs'] | default(omit) }}"
          register: aap_ocp_auth_results
          when: aap_ocp_install_connection['api_key'] is not defined

        - name: Set authentication for provided API key
          ansible.builtin.set_fact:
            aap_ocp_auth_results:
              openshift_auth:
                host: "{{ aap_ocp_install_connection['host'] | mandatory }}"
                api_key: "{{ aap_ocp_install_connection['api_key'] | mandatory }}"
                validate_certs: "{{ aap_ocp_install_connection['validate_certs'] | default(omit) }}"
          when: aap_ocp_install_connection['api_key'] is defined

        - name: Set AAP operator subscription name
          ansible.builtin.set_fact:
            aap_ocp_operator_subscription_name: ansible-automation-platform-operator

        - name: OCP object retrieval (Block)
          environment:
            K8S_AUTH_HOST: "{{ aap_ocp_auth_results['openshift_auth']['host'] }}"
            K8S_AUTH_API_KEY: "{{ aap_ocp_auth_results['openshift_auth']['api_key'] }}"
            K8S_AUTH_VERIFY_SSL: "{{ aap_ocp_install_connection['validate_certs'] | default(omit) }}"
          block:
            - name: Get current AAP operator Subscription
              kubernetes.core.k8s_info:
                kind: Subscription
                name: "{{ aap_ocp_operator_subscription_name }}"
                api_version: operators.coreos.com/v1alpha1
                namespace: "{{ aap_ocp_install_namespace }}"
              register: aap_subscription_before

            - name: Check current subscription channel is 2.4 or 2.6
              ansible.builtin.assert:
                that:
                  - aap_subscription_before.resources | length > 0
                  - aap_subscription_before.resources[0].spec.channel is match('^stable-2\\.(4|6)(-cluster-scoped)?$')
                fail_msg: "Current subscription channel must be stable-2.4, stable-2.4-cluster-scoped, stable-2.6, or stable-2.6-cluster-scoped, got: {{ aap_subscription_before.resources[0].spec.channel | default('N/A') }}"

            - name: Check destination channel is 2.6 and scoping matches current
              ansible.builtin.assert:
                that:
                  - aap_ocp_install_operator.channel is match('^stable-2\\.6(-cluster-scoped)?$')
                  - (aap_subscription_before.resources[0].spec.channel | default('') is search('cluster-scoped')) == (aap_ocp_install_operator.channel | default('') is search('cluster-scoped'))
                fail_msg: "Destination channel must be stable-2.6 or stable-2.6-cluster-scoped and scoping must match current channel. Current: {{ aap_subscription_before.resources[0].spec.channel }}, Destination: {{ aap_ocp_install_operator.channel }}"

            - name: Create AutomationControllerBackup
              when: aap_ocp_upgrade_create_backups | bool
              kubernetes.core.k8s:
                state: present
                resource_definition:
                  apiVersion: automationcontroller.ansible.com/v1beta1
                  kind: AutomationControllerBackup
                  metadata:
                    name: "{{ aap_ocp_upgrade_controller_backup_name }}"
                    namespace: "{{ aap_ocp_install_controller['namespace'] | default(aap_ocp_install_namespace) }}"
                  spec:
                    deployment_name: "{{ aap_ocp_install_controller.instance_name }}"
                wait: true

            - name: Create AutomationHubBackup
              when: aap_ocp_upgrade_create_backups | bool
              kubernetes.core.k8s:
                state: present
                resource_definition:
                  apiVersion: automationhub.ansible.com/v1beta1
                  kind: AutomationHubBackup
                  metadata:
                    name: "{{ aap_ocp_upgrade_hub_backup_name }}"
                    namespace: "{{ aap_ocp_install_hub['namespace'] | default(aap_ocp_install_namespace) }}"
                  spec:
                    deployment_name: "{{ aap_ocp_install_hub.instance_name }}"
                wait: true

            - name: Wait for AutomationControllerBackup to succeed
              when: aap_ocp_upgrade_create_backups | bool
              kubernetes.core.k8s_info:
                kind: AutomationControllerBackup
                name: "{{ aap_ocp_upgrade_controller_backup_name }}"
                api_version: automationcontroller.ansible.com/v1beta1
                namespace: "{{ aap_ocp_install_controller['namespace'] | default(aap_ocp_install_namespace) }}"
              register: aap_controller_backup_status
              until:
                - aap_controller_backup_status.resources | length > 0
                - aap_controller_backup_status.resources[0].status is defined
                - aap_controller_backup_status.resources[0].status.conditions is defined
                - (aap_controller_backup_status.resources[0].status.conditions | selectattr('type', 'equalto', 'Successful') | map(attribute='status') | first | default('')) == 'True' or
                  (aap_controller_backup_status.resources[0].status.conditions | selectattr('type', 'equalto', 'Failure') | map(attribute='status') | first | default('')) == 'True'
              retries: 120 # Wait for 30 minutes (120*15/60)
              delay: 15

            - name: Wait for AutomationHubBackup to succeed
              when: aap_ocp_upgrade_create_backups | bool
              kubernetes.core.k8s_info:
                kind: AutomationHubBackup
                name: "{{ aap_ocp_upgrade_hub_backup_name }}"
                api_version: automationhub.ansible.com/v1beta1
                namespace: "{{ aap_ocp_install_hub['namespace'] | default(aap_ocp_install_namespace) }}"
              register: aap_hub_backup_status
              until:
                - aap_hub_backup_status.resources | length > 0
                - aap_hub_backup_status.resources[0].status is defined
                - aap_hub_backup_status.resources[0].status.conditions is defined
                - (aap_hub_backup_status.resources[0].status.conditions | selectattr('type', 'equalto', 'Successful') | map(attribute='status') | first | default('')) == 'True' or
                  (aap_hub_backup_status.resources[0].status.conditions | selectattr('type', 'equalto', 'Failure') | map(attribute='status') | first | default('')) == 'True'
              retries: 120 # Wait for 30 minutes (120*15/60)
              delay: 15

            - name: Check if Automation Controller backup failed
              when:
                - (aap_controller_backup_status.resources[0].status.conditions | selectattr('type', 'equalto', 'Failure') | map(attribute='status') | first | default('')) == 'True'
              ansible.builtin.fail:
                msg: "Automation Controller backup failed"

            - name: Check if Automation Hub backup failed
              when:
                - (aap_hub_backup_status.resources[0].status.conditions | selectattr('type', 'equalto', 'Failure') | map(attribute='status') | first | default('')) == 'True'
              ansible.builtin.fail:
                msg: "Automation Hub backup failed"

            - name: Update AAP operator Subscription channel to {{ aap_ocp_install_operator.channel }}
              kubernetes.core.k8s:
                state: present
                definition:
                  kind: Subscription
                  apiVersion: operators.coreos.com/v1alpha1
                  metadata:
                    name: "{{ aap_ocp_operator_subscription_name }}"
                    namespace: "{{ aap_ocp_install_namespace }}"
                  spec: "{{ aap_subscription_before.resources[0].spec | combine({'channel': aap_ocp_install_operator.channel}, recursive=false) }}"
              when: aap_subscription_before.resources | length > 0

            - name: Wait for AAP operator InstallPlan to appear
              when:
                - aap_subscription_before.resources | length > 0
                - (aap_subscription_before.resources[0].spec.installPlanApproval | default('Manual')) == 'Manual'
              kubernetes.core.k8s_info:
                kind: Subscription
                name: "{{ aap_ocp_operator_subscription_name }}"
                api_version: operators.coreos.com/v1alpha1
                namespace: "{{ aap_ocp_install_namespace }}"
              register: aap_installplan_result
              until:
                - aap_installplan_result is defined
                - ('resources' in aap_installplan_result)
                - aap_installplan_result.resources | length > 0
                - ('status' in aap_installplan_result.resources[0])
                - (aap_installplan_result.resources[0].status.installplan.name is defined) or (aap_installplan_result.resources[0].status.installPlanRef.name is defined)
              retries: 60
              delay: 15

            - name: Set AAP InstallPlan name for approval
              when:
                - aap_subscription_before.resources | length > 0
                - (aap_subscription_before.resources[0].spec.installPlanApproval | default('Manual')) == 'Manual'
                - aap_installplan_result.resources | length > 0
              ansible.builtin.set_fact:
                aap_installplan_name: "{{ aap_installplan_result.resources[0].status.installplan.name | default(aap_installplan_result.resources[0].status.installPlanRef.name) }}"

            - name: Approve AAP operator InstallPlan
              when:
                - aap_subscription_before.resources | length > 0
                - (aap_subscription_before.resources[0].spec.installPlanApproval | default('Manual')) == 'Manual'
                - aap_installplan_name is defined
              kubernetes.core.k8s:
                state: present
                definition:
                  kind: InstallPlan
                  apiVersion: operators.coreos.com/v1alpha1
                  metadata:
                    namespace: "{{ aap_ocp_install_namespace }}"
                    name: "{{ aap_installplan_name }}"
                  spec:
                    approved: true

            - name: Wait for AAP operator Subscription currentCSV
              when: aap_subscription_before.resources | length > 0
              kubernetes.core.k8s_info:
                kind: Subscription
                name: "{{ aap_ocp_operator_subscription_name }}"
                api_version: operators.coreos.com/v1alpha1
                namespace: "{{ aap_ocp_install_namespace }}"
              register: aap_subscription_approved
              until:
                - aap_subscription_approved.resources[0].status.currentCSV is defined
                - aap_subscription_approved.resources[0].status.currentCSV | length > 0
              retries: 60
              delay: 15

            - name: Wait for AAP operator CSV to be Succeeded
              when: aap_subscription_before.resources | length > 0
              kubernetes.core.k8s_info:
                kind: ClusterServiceVersion
                name: "{{ aap_subscription_approved.resources[0].status.currentCSV }}"
                api_version: operators.coreos.com/v1alpha1
                namespace: "{{ aap_ocp_install_namespace }}"
              register: aap_csv_result
              until:
                - aap_csv_result.resources[0].status.phase is defined
                - aap_csv_result.resources[0].status.phase | length > 0
                - aap_csv_result.resources[0].status.phase == "Succeeded"
              retries: 60
              delay: 15

            - name: Create Gateway db secret
              when:
                - aap_ocp_install_platform.external_db.enabled | default(false) | bool
              kubernetes.core.k8s:
                state: present
                resource_definition:
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: "{{ aap_ocp_db_secret_names.platform }}"
                    namespace: "{{ aap_ocp_install_namespace }}"
                  stringData:
                    host: "{{ aap_ocp_install_platform.external_db.host }}"
                    port: "{{ aap_ocp_install_platform.external_db.port | string }}"
                    database: "{{ aap_ocp_install_platform.external_db.name }}"
                    username: "{{ aap_ocp_install_platform.external_db.username }}"
                    password: "{{ aap_ocp_install_platform.external_db.password }}"
                    sslmode: "{{ aap_ocp_install_platform.external_db.sslmode }}"
                    type: "unmanaged"
                wait: true

            - name: Create or update AnsibleAutomationPlatform CR (required for 2.6 Web UI)
              when: aap_subscription_before.resources | length > 0
              kubernetes.core.k8s:
                state: present
                resource_definition:
                  apiVersion: aap.ansible.com/v1alpha1
                  kind: AnsibleAutomationPlatform
                  metadata:
                    name: "{{ aap_ocp_install_platform.instance_name }}"
                    namespace: "{{ aap_ocp_install_namespace }}"
                  spec:
                    database:
                      database_secret: "{{ aap_ocp_external_db.platform.secret_name }}"
                    no_log: false
                    controller:
                      name: "{{ aap_ocp_install_controller.instance_name }}"
                      disabled: "{{ aap_ocp_install_platform.controller_disabled | default(false) }}"
                    hub:
                      name: "{{ aap_ocp_install_hub.instance_name }}"
                      disabled: "{{ aap_ocp_install_platform.hub_disabled | default(false) }}"
                    eda:
                      disabled: "{{ aap_ocp_install_platform.eda_disabled | default(true) }}"
                wait: true

            - name: Get platform gateway Route
              when: aap_subscription_before.resources | length > 0
              kubernetes.core.k8s_info:
                kind: Route
                name: "{{ aap_ocp_install_platform.instance_name }}"
                api_version: route.openshift.io/v1
                namespace: "{{ aap_ocp_install_namespace }}"
              register: aap_platform_route_result
              until:
                - aap_platform_route_result.resources | length > 0
                - aap_platform_route_result.resources[0].spec is defined
                - aap_platform_route_result.resources[0].spec.host is defined
              retries: 120 # Wait for 30 minutes (120*15/60)
              delay: 15

            - name: Set platform URL from Route
              ansible.builtin.set_fact:
                aap_ocp_platform_route: "https://{{ aap_platform_route_result.resources[0].spec.host }}"

            - name: Get platform admin password from Secret
              when: aap_ocp_platform_route is defined
              kubernetes.core.k8s_info:
                kind: Secret
                name: "{{ aap_ocp_install_platform.instance_name }}-admin-password"
                api_version: v1
                namespace: "{{ aap_ocp_install_namespace }}"
              register: platform_admin_secret
              until:
                - platform_admin_secret.resources | length > 0
                - platform_admin_secret.resources[0].data is defined
                - platform_admin_secret.resources[0].data['password'] is defined
              retries: 120 # Wait for 30 minutes (120*15/60)
              delay: 15

            - name: Set platform admin password fact
              ansible.builtin.set_fact:
                aap_ocp_platform_admin_password: "{{ platform_admin_secret.resources[0].data['password'] | b64decode }}"

            - name: Check platform status
              when:
                - aap_ocp_platform_route is defined
                - aap_ocp_platform_admin_password is defined
              ansible.builtin.uri:
                url: "{{ aap_ocp_platform_route }}/api/gateway/v1/status"
                method: GET
                return_content: true
                validate_certs: "{{ aap_ocp_install_connection['validate_certs'] | default(true) }}"
                url_username: admin
                url_password: "{{ aap_ocp_platform_admin_password }}"
                force_basic_auth: true
              register: platform_status_result
              ignore_errors: true
              until:
                - platform_status_result.status | default(0) == 200
                - platform_status_result.content is defined
                - platform_status_result.content | length > 0
                - (platform_status_result.content | from_json).status | default('') == 'good'
                - (platform_status_result.content | from_json).services | default([]) | selectattr('status', 'equalto', 'good') | list | length == (platform_status_result.content | from_json).services | default([]) | length
              retries: 120 # Wait for 30 minutes (120*15/60)
              delay: 15

            - name: Remove ConsoleLink CRs for controller and Automation Hub instances
              when: aap_subscription_before.resources | length > 0
              kubernetes.core.k8s:
                state: absent
                kind: ConsoleLink
                api_version: console.openshift.io/v1
                name: "{{ item }}"
              loop:
                - "{{ aap_ocp_install_controller.instance_name }}"
                - "{{ aap_ocp_install_hub.instance_name }}"

            - name: Add ConsoleLink CR for AAP Platform
              when:
                - aap_subscription_before.resources | length > 0
                - aap_ocp_platform_route is defined
              kubernetes.core.k8s:
                state: present
                definition:
                  apiVersion: console.openshift.io/v1
                  kind: ConsoleLink
                  metadata:
                    name: "{{ aap_ocp_install_platform.instance_name }}"
                  spec:
                    applicationMenu:
                      section: Red Hat Applications
                      imageURL: data:image/png;base64,
                    text: "{{ aap_ocp_install_platform.link_text | default('AAP - ' + aap_ocp_install_platform.instance_name) }}"
                    href: "{{ aap_ocp_platform_route }}"
                    location: ApplicationMenu

            - name: Output Platform URL
              ansible.builtin.debug:
                msg: "AAP Platform URL - {{ aap_ocp_platform_route | default('N/A') }}"

      always:
        - name: Revoke OpenShift API token (runs on success or failure)
          when:
            - aap_ocp_auth_results is defined
            - aap_ocp_auth_results['openshift_auth']['api_key'] is defined
            - aap_ocp_install_connection['api_key'] is not defined
          redhat.openshift.openshift_auth:
            host: "{{ aap_ocp_install_connection['host'] | mandatory }}"
            validate_certs: "{{ aap_ocp_install_connection['validate_certs'] | default(omit) }}"
            state: absent
            api_key: "{{ aap_ocp_auth_results['openshift_auth']['api_key'] }}"
          changed_when: false

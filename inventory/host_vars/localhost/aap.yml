aap_ocp_install_platform:
  instance_name: demo-aap
  link_text: Demo - AAP
  eda_disabled: true

aap_ocp_install_controller:
  # namespace: demo-aap-ctlr
  instance_name: demo-ctlr
  link_text: Demo - AAP Controller
  controller_manifest_overrides:
    spec:
      postgres_configuration_secret: "{{ aap_ocp_external_db.controller.secret_name if aap_ocp_external_db.controller.enabled | default(false) | bool else omit }}"

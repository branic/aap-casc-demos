aap_ocp_install_hub:
  # namespace: aap-hub
  instance_name: demo-hub
  link_text: Demo - AAP Private Hub
  hub_manifest_overrides:
    spec:
      storage_type: File
      file_storage_access_mode: ReadWriteMany
      file_storage_storage_class: "{{ rwx_storage_class_name }}"
      postgres_configuration_secret: "{{ aap_ocp_external_db.hub.secret_name if aap_ocp_external_db.hub.enabled | default(false) | bool else omit }}"
      pulp_settings:
        CONNECTED_ANSIBLE_CONTROLLERS:
          - "{{ aap_ocp_install_controller_route | default(omit) }}"
